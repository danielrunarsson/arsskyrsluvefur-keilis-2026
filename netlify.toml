# Netlify: static Astro build. Deploys on every push once the repo is linked.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Production: pages without content are left out of the build.
# GOATCOUNTER_KODI: kóði GoatCounter-síðunnar (t.d. „keilir“ fyrir keilir.goatcounter.com).
# Tómt = engin gestatalning. Talning er aðeins á lifandi vef, aldrei í forskoðunum.
[context.production.environment]
  SYNA_VANTAR = "false"
  GOATCOUNTER_KODI = "keilir2026"

# Previews and branch deploys show the "Efni vantar" pages and /innra/veftre/.
[context.deploy-preview.environment]
  SYNA_VANTAR = "true"

[context.branch-deploy.environment]
  SYNA_VANTAR = "true"

# Lighthouse keyrir á hverju deployi (líka forskoðunum) á lykilsíðum.
# Deploy fellur ef aðgengi fer undir 0,95 eða best practices undir 0,9.
# Afköst og SEO eru mæld og sýnd í deploy-yfirlitinu en stöðva ekki deploy: byggingarvélin er ekki
# raunhæft afkastamælitæki, og forskoðanir eru viljandi „noindex“ sem lækkar SEO-einkunn þeirra.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    fail_deploy_on_score_thresholds = "true"

  [plugins.inputs.thresholds]
    accessibility = 0.95
    best-practices = 0.9

  [[plugins.inputs.audits]]
    path = "index.html"

  [[plugins.inputs.audits]]
    path = "avarp/index.html"

  [[plugins.inputs.audits]]
    path = "efnahagur/index.html"

  [[plugins.inputs.audits]]
    path = "vallarstjori/index.html"

  [[plugins.inputs.audits]]
    path = "hringir/index.html"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
