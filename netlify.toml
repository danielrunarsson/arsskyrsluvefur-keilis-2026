# Netlify: static Astro build. Deploys on every push once the repo is linked.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Production: pages without content are left out of the build.
[context.production.environment]
  SYNA_VANTAR = "false"

# Previews and branch deploys show the "Efni vantar" pages and /innra/veftre/.
[context.deploy-preview.environment]
  SYNA_VANTAR = "true"

[context.branch-deploy.environment]
  SYNA_VANTAR = "true"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
